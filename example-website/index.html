<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->
    <title>Product Preview Card Component</title>
    <link rel="stylesheet" href="./css/index.css">
    <link href="./css/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="flex items-center justify-center bg-primary-two 
                min-h-screen w-full
                overflow-x-hidden">
        <main class="max-w-md sm:max-w-2xl overflow-hidden rounded-xl 
                     grid grid-cols-1 sm:grid-cols-2 m-6">
            <section class="w-full h-full">
                <img class="object-cover object-center w-full aspect-[4/3] sm:h-full"
                     id="preview-image"
                     alt="Product_Img"
                >
            </section>
            <article class="bg-white p-7 space-y-6">
                <h2 class="tracking-[0.2em] uppercase text-neutral-two">PERFUME</h2>
                <h1 class="font-primary font-bold text-4xl">Gabrielle Essence Eau de Parfum</h1>
                <p class="text-neutral-two">
                   A floral, solar and vuluptuous interpretation
                   composed by Olivier Polge, Perfumer-Creator for the
                   House of CHANEL.
                </p>
                <div>
                    <h1 class="font-primary text-primary-one text-3xl inline-block mr-4">
                        $149.99
                    </h1>
                    <p class="line-through text-neutral-two text-md inline-block align-super">
                        $169.99
                    </p>
                </div>
                <button type="button" 
                        class="w-full text-center py-4 
                        bg-primary-one hover:bg-neutral-one transition-all text-white font-bold
                        rounded-lg">
                    <img src="./images/icon-cart.svg" class="inline-block mr-1 align-sub" 
                         alt="cart_icon">
                    Add to Cart
                </button>
            </article>
        </main>
    </div>
</body>
</html>
